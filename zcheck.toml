schema = 1
default = "check"

[execution]
jobs = 4
default_timeout = "20m"
repository_state = "preserve"

[tasks.zrail]
description = "Enforce reviewed architecture and repository policy."
run = ["zrail", "check"]
tools = ["zrail"]
inputs = ["zrail.toml", "zrail.lock"]

[tasks.git-diff]
description = "Reject whitespace errors in unstaged changes."
run = ["git", "diff", "--check"]
tools = ["git"]

[tasks.git-diff-cached]
description = "Reject whitespace errors in staged changes."
run = ["git", "diff", "--cached", "--check"]
tools = ["git"]

[tasks.repository]
description = "Validate architecture policy and repository diff hygiene."
needs = ["zrail", "git-diff", "git-diff-cached"]

[tasks.format]
description = "Validate Rust formatting."
run = ["cargo", "fmt", "--all", "--", "--check"]
tools = ["cargo"]
resources = ["cargo-target"]

[tasks.clippy]
description = "Run Clippy on every target with warnings denied."
run = [
  "cargo",
  "clippy",
  "--workspace",
  "--all-targets",
  "--all-features",
  "--locked",
  "--offline",
  "--",
  "-D",
  "warnings",
]
tools = ["cargo"]
resources = ["cargo-target"]

[tasks.docs]
description = "Build workspace documentation with warnings denied."
run = [
  "cargo",
  "doc",
  "--workspace",
  "--all-features",
  "--no-deps",
  "--locked",
  "--offline",
]
env = { RUSTDOCFLAGS = "-D warnings" }
tools = ["cargo"]
resources = ["cargo-target"]

[tasks.rust-lint]
description = "Validate formatting, lints, and documentation."
needs = ["format", "clippy", "docs"]

[tasks.test-msrv]
description = "Run every workspace test target on Rust 1.88."
run = [
  "cargo",
  "+1.88.0",
  "test",
  "--workspace",
  "--all-targets",
  "--all-features",
  "--locked",
  "--offline",
]
tools = ["cargo"]
resources = ["cargo-target"]

[tasks.test-current]
description = "Run every workspace test target on the repository-pinned toolchain."
run = [
  "cargo",
  "test",
  "--workspace",
  "--all-targets",
  "--all-features",
  "--locked",
  "--offline",
]
tools = ["cargo"]
resources = ["cargo-target"]

[tasks.doctest]
description = "Run workspace public API examples and documentation tests."
run = [
  "cargo",
  "test",
  "--workspace",
  "--doc",
  "--all-features",
  "--locked",
  "--offline",
]
tools = ["cargo"]
resources = ["cargo-target"]

[tasks.api-evolution]
description = "Prove downstream matching contracts on the MSRV and current toolchains."
run = ["scripts/check-api-evolution", ".", "target/api-evolution"]
tools = ["bash", "cargo", "jq", "shasum"]
resources = ["cargo-target"]

[tasks.rust-test]
description = "Validate behavior on the MSRV and repository toolchains."
needs = ["test-msrv", "test-current", "doctest", "api-evolution"]

[tasks.package]
description = "Build and verify the publishable zio crate archive."
run = ["cargo", "package", "-p", "zio", "--allow-dirty", "--locked", "--offline"]
tools = ["cargo"]
resources = ["cargo-target"]

[tasks.qualify-smoke]
description = "Exercise the bounded timing runner and receipt path."
run = [
  "cargo",
  "run",
  "-p",
  "zio-qualify",
  "--no-default-features",
  "--bin",
  "zio-perf",
  "--locked",
  "--offline",
  "--",
  "--smoke",
  "--output",
  "target/zio-perf-smoke.ndjson",
]
tools = ["cargo"]
resources = ["cargo-target"]

[tasks.qualify-allocation-smoke]
description = "Exercise the bounded allocation runner and receipt path."
run = [
  "cargo",
  "run",
  "-p",
  "zio-qualify",
  "--no-default-features",
  "--features",
  "allocation-metrics",
  "--bin",
  "zio-perf-alloc",
  "--locked",
  "--offline",
  "--",
  "--smoke",
  "--output",
  "target/zio-perf-allocation-smoke.ndjson",
]
tools = ["cargo"]
resources = ["cargo-target"]

[tasks.qualify-smoke-receipts]
description = "Validate every bounded timing and allocation smoke receipt."
needs = ["qualify-smoke", "qualify-allocation-smoke"]
run = [
  "jq",
  "-e",
  "-s",
  "length == 140 and ([.[] | select(.metric == \"timing\")] | length) == 70 and ([.[] | select(.metric == \"allocation\")] | length) == 70 and ([.[] | [.metric, .candidate.name, .scenario.name]] | unique | length) == 140 and all(.[]; .schema == \"zio.perf.v2\" and (.status == \"passed\" or .status == \"unsupported\"))",
  "target/zio-perf-smoke.ndjson",
  "target/zio-perf-allocation-smoke.ndjson",
]
tools = ["jq"]

[tasks.stable-evidence-contract]
description = "Reject incomplete, stale, dirty, or duplicated stable-release evidence."
run = ["scripts/test-qualify-1.0"]
tools = ["bash", "jq"]

[tasks.check]
description = "Run complete local zio qualification."
needs = [
  "repository",
  "rust-lint",
  "rust-test",
  "package",
  "qualify-smoke-receipts",
  "stable-evidence-contract",
]

[tasks.release-rehearsal]
description = "Verify a clean package archive and independent consumer."
needs = ["check"]
run = ["scripts/rehearse-release"]
tools = ["bash", "cargo", "git", "jq", "shasum", "tar"]
resources = ["cargo-target"]

[tasks.release]
description = "Run the complete release-candidate rehearsal."
needs = ["release-rehearsal"]
