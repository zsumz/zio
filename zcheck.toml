schema = 1
default = "check"

[execution]
jobs = 4
default_timeout = "20m"
repository_state = "preserve"

[tasks.zrail]
description = "Enforce reviewed architecture and repository policy."
run = ["zrail", "check"]
tools = ["zrail"]
inputs = ["zrail.toml", "zrail.lock"]

[tasks.git-diff]
description = "Reject whitespace errors in unstaged changes."
run = ["git", "diff", "--check"]
tools = ["git"]

[tasks.git-diff-cached]
description = "Reject whitespace errors in staged changes."
run = ["git", "diff", "--cached", "--check"]
tools = ["git"]

[tasks.repository]
description = "Validate architecture policy and repository diff hygiene."
needs = ["zrail", "git-diff", "git-diff-cached"]

[tasks.format]
description = "Validate Rust formatting."
run = ["cargo", "fmt", "--all", "--", "--check"]
tools = ["cargo"]
resources = ["cargo-target"]

[tasks.clippy]
description = "Run Clippy on every target with warnings denied."
run = [
  "cargo",
  "clippy",
  "--all-targets",
  "--locked",
  "--offline",
  "--",
  "-D",
  "warnings",
]
tools = ["cargo"]
resources = ["cargo-target"]

[tasks.docs]
description = "Build library documentation with warnings denied."
run = ["cargo", "doc", "--no-deps", "--locked", "--offline"]
env = { RUSTDOCFLAGS = "-D warnings" }
tools = ["cargo"]
resources = ["cargo-target"]

[tasks.rust-lint]
description = "Validate formatting, lints, and documentation."
needs = ["format", "clippy", "docs"]

[tasks.test-msrv]
description = "Run every test target on Rust 1.88."
run = ["cargo", "+1.88.0", "test", "--all-targets", "--locked", "--offline"]
tools = ["cargo"]
resources = ["cargo-target"]

[tasks.test-current]
description = "Run every test target on the repository-pinned toolchain."
run = ["cargo", "test", "--all-targets", "--locked", "--offline"]
tools = ["cargo"]
resources = ["cargo-target"]

[tasks.doctest]
description = "Run public API examples and documentation tests."
run = ["cargo", "test", "--doc", "--locked", "--offline"]
tools = ["cargo"]
resources = ["cargo-target"]

[tasks.rust-test]
description = "Validate behavior on the MSRV and repository toolchains."
needs = ["test-msrv", "test-current", "doctest"]

[tasks.package]
description = "Build and verify the publishable crate archive."
run = ["cargo", "package", "--allow-dirty", "--locked", "--offline"]
tools = ["cargo"]
resources = ["cargo-target"]

[tasks.check]
description = "Run complete local zio qualification."
needs = ["repository", "rust-lint", "rust-test", "package"]
