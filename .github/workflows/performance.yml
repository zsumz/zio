name: Performance qualification

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  measure:
    name: ${{ matrix.runner }} replica ${{ matrix.replica }} receipts
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
        replica: [1, 2, 3, 4, 5]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Fetch the locked dependency graph
        run: cargo +1.97.1 fetch --locked

      - name: Build the benchmark runner
        run: >-
          cargo +1.97.1 build -p zio-qualify --bin zio-perf
          --release --no-default-features --locked --offline

      - name: Capture uninstrumented timing receipts
        env:
          PERF_DIR: ${{ runner.temp }}/zio-performance
        run: |
          set -euo pipefail
          mkdir -p "$PERF_DIR"
          hard_limit="$(ulimit -Hn)"
          desired_limit=8192
          if [[ "$hard_limit" != unlimited && "$hard_limit" -lt "$desired_limit" ]]; then
            desired_limit="$hard_limit"
          fi
          ulimit -Sn "$desired_limit"
          {
            uname -a
            rustc +1.97.1 -vV
            git rev-parse HEAD
            printf 'replica=%s\n' '${{ matrix.replica }}'
            printf 'open-file-soft-limit=%s\n' "$(ulimit -n)"
          } > "$PERF_DIR/platform.txt"
          target/release/zio-perf \
            --output "$PERF_DIR/timing.ndjson" \
            2> "$PERF_DIR/timing-summary.txt"

      - name: Build the allocation runner
        run: >-
          cargo +1.97.1 build -p zio-qualify --bin zio-perf-alloc
          --release --no-default-features --features allocation-metrics
          --locked --offline

      - name: Capture instrumented allocation receipts
        env:
          PERF_DIR: ${{ runner.temp }}/zio-performance
        run: >-
          target/release/zio-perf-alloc
          --output "$PERF_DIR/allocation.ndjson"
          2> "$PERF_DIR/allocation-summary.txt"

      - name: Validate kqueue skew receipt path
        if: runner.os == 'macOS'
        env:
          PERF_DIR: ${{ runner.temp }}/zio-performance
        run: |
          cargo +1.97.1 build -p zio-qualify --bin zio-kqueue-skew \
            --release --no-default-features --features kqueue-skew \
            --locked --offline
          target/release/zio-kqueue-skew --smoke \
            --output "$PERF_DIR/kqueue-skew-smoke.ndjson"
          jq -e '
            .schema == "zio.kqueue-skew.v1" and
            .status == "passed" and
            .git.sha == env.GITHUB_SHA and
            .git.dirty == false and
            .parameters.registrations == 5 and
            .parameters.event_capacity == 2 and
            .parameters.ready_registrations == 3 and
            .level.waits_to_complete_cycle == 2 and
            .level.unique_registrations_delivered == 3 and
            .one_shot.waits_to_complete_cycle == 2 and
            .one_shot.logical_events_delivered == 3 and
            .one_shot.disarmed_registrations == 3 and
            .one_shot.disarm_submissions == 2 and
            .one_shot.retained_heap.bytes_current > 0
          ' "$PERF_DIR/kqueue-skew-smoke.ndjson"

      - name: Validate complete receipt coverage
        env:
          PERF_DIR: ${{ runner.temp }}/zio-performance
        run: |
          jq -e -s '
            length == 156 and
            ([.[] | select(.metric == "timing")] | length) == 78 and
            ([.[] | select(.metric == "allocation")] | length) == 78 and
            ([.[] | [.metric, .candidate.name, .scenario.name]] | unique | length) == 156 and
            all(.[];
              .schema == "zio.perf.v2" and
              (.status == "passed" or .status == "unsupported") and
              .parameters.samples == (if .metric == "timing" then 96 else 12 end) and
              .git.sha == env.GITHUB_SHA and
              .git.dirty == false
            )
          ' "$PERF_DIR/timing.ndjson" "$PERF_DIR/allocation.ndjson"

      - name: Prove registration descriptor and allocation contracts
        env:
          PERF_DIR: ${{ runner.temp }}/zio-performance
        run: |
          jq -e -s '
            [
              .[] |
              select(
                .metric == "allocation" and
                (.scenario.name == "registration.register.batch_64" or
                  .scenario.name == "registration.delete.batch_64") and
                (.candidate.name == "zio" or .candidate.name == "zio-borrowed")
              )
            ] as $receipts |
            ($receipts | length) == 4 and
            all($receipts[];
              .status == "passed" and
              .summary.allocation_count_total == 0 and
              .summary.allocation_bytes_total == 0 and
              .live_fds.status == "available" and
              ((if .candidate.name == "zio" then 64 else 0 end) as $retained |
                ([.live_fds.candidate_setup, .live_fds.active] | transpose |
                  all(.[]; .[1] - .[0] == $retained))) and
              ([.live_fds.candidate_setup, .live_fds.post_cleanup] | transpose |
                all(.[]; .[1] == .[0])) and
              .retained_fds.status == "available" and
              all(.retained_fds.raw_delta[]; . == 0)
            )
          ' "$PERF_DIR/allocation.ndjson"

      - name: Install Linux syscall tracer
        if: runner.os == 'Linux'
        env:
          PERF_DIR: ${{ runner.temp }}/zio-performance
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends strace
          strace --version > "$PERF_DIR/strace-version.txt"

      - name: Prove Linux wake and persistent syscall contracts
        if: runner.os == 'Linux'
        env:
          PERF_DIR: ${{ runner.temp }}/zio-performance
        run: |
          set -euo pipefail
          command -v strace

          wake_trace="$PERF_DIR/syscalls-wake-pretriggered.trace"
          strace -qq -yy \
            -e trace=eventfd2,read,write,epoll_create1,epoll_ctl,epoll_wait \
            -o "$wake_trace" \
            target/release/zio-perf \
            --implementation zio \
            --scenario wake.notify.pretriggered \
            --samples 1 --iterations 100 --warmup 1 \
            --output "$PERF_DIR/syscalls-wake-pretriggered.ndjson" \
            2> "$PERF_DIR/syscalls-wake-pretriggered-summary.txt"
          jq -e '
            .schema == "zio.perf.v2" and .status == "passed" and
            .parameters.iterations == 100 and .raw.operations == [100]
          ' "$PERF_DIR/syscalls-wake-pretriggered.ndjson"
          wake_writes="$(grep -Ec 'write\(.*<anon_inode:\[eventfd\]>' "$wake_trace" || true)"
          wake_reads="$(grep -Ec 'read\(.*<anon_inode:\[eventfd\]>' "$wake_trace" || true)"
          test "$wake_writes" -eq 101
          test "$wake_reads" -eq 0

          for implementation in zio zio-borrowed; do
            for iterations in 1 100; do
              stem="syscalls-persistent-$implementation-$iterations"
              trace="$PERF_DIR/$stem.trace"
              receipt="$PERF_DIR/$stem.ndjson"
              strace -qq -yy -e trace=fcntl,epoll_ctl \
                -o "$trace" \
                target/release/zio-perf \
                --implementation "$implementation" \
                --scenario wait.ready.readable.single.persistent \
                --samples 1 --iterations "$iterations" --warmup 1 \
                --output "$receipt" \
                2> "$PERF_DIR/$stem-summary.txt"
              jq -e --arg implementation "$implementation" \
                --argjson iterations "$iterations" '
                .schema == "zio.perf.v2" and .status == "passed" and
                .candidate.name == $implementation and
                .parameters.iterations == $iterations and
                .raw.operations == [$iterations]
              ' "$receipt"
            done
          done
          {
            printf 'wake-eventfd-writes=%s\n' "$wake_writes"
            printf 'wake-eventfd-reads=%s\n' "$wake_reads"
            for implementation in zio zio-borrowed; do
              one_trace="$PERF_DIR/syscalls-persistent-$implementation-1.trace"
              hundred_trace="$PERF_DIR/syscalls-persistent-$implementation-100.trace"
              one_adds="$(grep -c 'EPOLL_CTL_ADD' "$one_trace")"
              one_deletes="$(grep -c 'EPOLL_CTL_DEL' "$one_trace")"
              one_dups="$(grep -c 'F_DUPFD_CLOEXEC' "$one_trace" || true)"
              hundred_adds="$(grep -c 'EPOLL_CTL_ADD' "$hundred_trace")"
              hundred_deletes="$(grep -c 'EPOLL_CTL_DEL' "$hundred_trace")"
              hundred_dups="$(grep -c 'F_DUPFD_CLOEXEC' "$hundred_trace" || true)"
              expected_dups=0
              if [[ "$implementation" == zio ]]; then
                expected_dups=2
              fi
              test "$one_adds" -eq 4
              test "$one_deletes" -eq 2
              test "$one_dups" -eq "$expected_dups"
              test "$hundred_adds" -eq "$one_adds"
              test "$hundred_deletes" -eq "$one_deletes"
              test "$hundred_dups" -eq "$one_dups"
              printf '%s-persistent-epoll-adds=%s\n' "$implementation" "$one_adds"
              printf '%s-persistent-epoll-deletes=%s\n' "$implementation" "$one_deletes"
              printf '%s-persistent-descriptor-dups=%s\n' "$implementation" "$one_dups"
            done
          } > "$PERF_DIR/syscalls-contract.txt"

      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zio-performance-${{ runner.os }}-replica-${{ matrix.replica }}
          path: ${{ runner.temp }}/zio-performance
          if-no-files-found: error
