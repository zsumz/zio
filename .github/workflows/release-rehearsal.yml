name: Release rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash

jobs:
  rehearse:
    name: Rehearse zio release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchains
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup toolchain install 1.97.1 \
            --profile minimal \
            --component clippy,rustfmt

      - name: Install qualification tools
        run: |
          cargo +1.97.1 install zcheck --version '=0.0.2' --locked
          cargo +1.97.1 install zrail --version '=0.0.3-rc.4' --locked

      - name: Fetch the locked dependency graph
        run: cargo +1.88.0 fetch --locked

      - name: Rehearse the release
        env:
          ZCHECK_CACHE_DIR: ${{ runner.temp }}/zcheck-cache
          ZCHECK_EVIDENCE_DIR: ${{ runner.temp }}/zcheck-evidence
          ZIO_RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/release-evidence
        run: >-
          zcheck run release
          --format github
          --logs-dir "$ZCHECK_EVIDENCE_DIR/logs"
          --receipt "$ZCHECK_EVIDENCE_DIR/receipt.json"

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zio-release-rehearsal
          path: |
            ${{ runner.temp }}/zcheck-evidence
            ${{ runner.temp }}/release-evidence
          if-no-files-found: error
