[workspace]
members = ["crates/zio-qualify", "crates/zio-testkit"]
default-members = ["."]
resolver = "3"

[workspace.package]
version = "0.0.1-dev.1"
edition = "2024"
rust-version = "1.88"
authors = ["zsumz <shawn@zsumz.com>"]
license = "Apache-2.0"
repository = "https://github.com/zsumz/zio"
homepage = "https://github.com/zsumz/zio"

[workspace.dependencies]
zio = { path = ".", version = "=0.0.1-dev.1", default-features = false, features = ["test-support"] }

[package]
name = "zio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Bounded, explicit readiness I/O for Rust."
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/zio"
readme = "README.md"
keywords = ["io", "epoll", "kqueue", "readiness", "event-loop"]
categories = ["asynchronous", "concurrency", "network-programming"]
include = [
  "/src/**",
  "/tests/**",
  "/Cargo.toml",
  "/Cargo.lock",
  "/README.md",
  "/docs/contracts.md",
  "/docs/performance.md",
  "/docs/qualification.md",
  "/zio-logo.svg",
  "/LICENSE",
]

[package.metadata.docs.rs]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-unknown-freebsd",
  "x86_64-unknown-netbsd",
]

[features]
default = []
test-support = []

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "freebsd", target_os = "netbsd"))'.dependencies]
libc = "0.2.189"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.4", default-features = false, features = ["event", "std"] }

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "freebsd", target_os = "netbsd"))'.dev-dependencies]
allocation-counter = "=0.8.1"
mio = { version = "=1.2.2", default-features = false, features = ["os-ext", "os-poll"] }
socket2 = "=0.6.5"

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
struct_field_names = "allow"
too_many_lines = "allow"
