[package]
name = "zio"
version = "0.0.1-dev.0"
edition = "2024"
rust-version = "1.88"
authors = ["zsumz <shawn@zsumz.com>"]
description = "Bounded, explicit readiness I/O for Rust."
license = "Apache-2.0"
repository = "https://github.com/zsumz/zio"
homepage = "https://github.com/zsumz/zio"
documentation = "https://docs.rs/zio"
readme = "README.md"
keywords = ["io", "epoll", "kqueue", "readiness", "event-loop"]
categories = ["asynchronous", "concurrency", "network-programming"]
include = [
  "/src/**",
  "/tests/**",
  "/Cargo.toml",
  "/Cargo.lock",
  "/README.md",
  "/LICENSE",
]

[package.metadata.docs.rs]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-unknown-freebsd",
  "x86_64-unknown-netbsd",
]

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "freebsd", target_os = "netbsd"))'.dependencies]
libc = "0.2.189"

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "freebsd", target_os = "netbsd"))'.dev-dependencies]
mio = { version = "1.2.2", default-features = false, features = ["os-ext", "os-poll"] }

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
struct_field_names = "allow"
too_many_lines = "allow"
