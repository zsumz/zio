<svg xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg" width="1040" height="260" viewBox="0 0 1040 260" role="img" aria-labelledby="title desc" version="1.1" id="svg49">
  <title id="title">zio</title>
  <desc id="desc">zio logo lockup with an illustrated industrial I/O selector, one explicit polling arm, portable readiness contacts, and the words portable I/O, explicit control.</desc>
  <defs id="defs6">
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#557d79" id="stop1"/>
      <stop offset="1" stop-color="#2f5352" id="stop2"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4bd7f" id="stop3"/>
      <stop offset="1" stop-color="#c9904f" id="stop4"/>
    </linearGradient>
    <radialGradient id="face" cx="38%" cy="30%" r="75%">
      <stop offset="0" stop-color="#fff9ed" id="stop5"/>
      <stop offset="1" stop-color="#eadbc5" id="stop6"/>
    </radialGradient>
  </defs>
  <rect id="background" width="1040" height="260" fill="#ffffff"/>
