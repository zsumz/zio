[[layer]]
may_depend_on = []
name = "library"
packages = ["zio"]
reason = "One focused readiness library owns its portable vocabulary and native backends."

[layer.dependencies]
external = "locked"

[[layer]]
may_depend_on = ["library"]
name = "verification"
packages = ["zio-testkit"]
reason = "Deterministic conformance support may exercise the public library without entering the product dependency graph."

[layer.dependencies]
external = "none"

[[layer]]
may_depend_on = ["library"]
name = "qualification"
packages = ["zio-qualify"]
reason = "Workspace-private peer adapters and benchmarks may exercise the public library without entering its dependency graph."

[layer.dependencies]
external = "locked"

[[owner]]
allow = [
    "src/sys/kqueue_group/kqueue.rs",
    "src/sys/kqueue_group/kqueue_codec.rs",
    "src/sys/kqueue_group/kqueue_delete_scope_test.rs",
    "src/sys/kqueue_group/kqueue_delete_transition_test.rs",
    "src/sys/kqueue_group/kqueue_policy.rs",
    "src/sys/kqueue_group/kqueue_policy_test.rs",
    "src/sys/kqueue_group/kqueue_timeout.rs",
    "src/sys/linux_group/backend.rs",
    "src/sys/linux_group/epoll.rs",
    "src/sys/linux_group/eventfd.rs",
]
kind = "capability"
match = "libc"
name = "native-libc-capability"
reason = "Only native backend and ABI-codec modules use libc directly; unsafe calls remain confined to the three reviewed syscall leaves."
within = ["src/**"]

[[owner]]
allow = [
    "crates/zio-qualify/src/benchmark/polling_backend.rs",
    "crates/zio-qualify/src/benchmark/polling_direct.rs",
    "crates/zio-qualify/src/benchmark/polling_lifecycle.rs",
    "crates/zio-qualify/src/polling_candidate.rs",
    "crates/zio-qualify/src/polling_registration.rs",
    "crates/zio-qualify/src/polling_registration_test.rs",
]
kind = "capability"
match = "polling"
name = "polling-adapter-capability"
reason = "Only the reviewed polling adapters and their focused safety proof may use polling directly."
within = ["crates/zio-qualify/src/**"]

[[ratchet]]
reason = "The epoll leaf keeps caller-arena layout, stamp validation, and unsafe phase transitions in one review boundary."
rule = "rust.file-size"
target = "src/sys/linux_group/epoll.rs"

[[ratchet]]
reason = "Reviewed kqueue FFI and kevent initialization remain confined to this syscall leaf."
rule = "rust.hygiene.unsafe"
target = "src/sys/kqueue_group/kqueue.rs"

[[ratchet]]
reason = "Reviewed epoll FFI, descriptor adoption, and caller-arena transitions remain confined to this syscall leaf."
rule = "rust.hygiene.unsafe"
target = "src/sys/linux_group/epoll.rs"

[[ratchet]]
reason = "Reviewed eventfd FFI and descriptor adoption remain confined to this syscall leaf."
rule = "rust.hygiene.unsafe"
target = "src/sys/linux_group/eventfd.rs"

[[ratchet]]
reason = "The sole polling registration leaf uses its unsafe borrowed-source API under an explicit delete-before-drop lifetime guard."
rule = "rust.hygiene.unsafe"
target = "crates/zio-qualify/src/polling_registration.rs"

[[ratchet]]
reason = "The qualification adapter retains its source through deletion while exercising the unsafe borrowed tier as an independent candidate."
rule = "rust.hygiene.unsafe"
target = "crates/zio-qualify/src/zio_borrowed_candidate.rs"

[[ratchet]]
reason = "The benchmark adapter carries source lifetimes through controlled deletion and terminally invalidates its poller before returning any adapter error."
rule = "rust.hygiene.unsafe"
target = "crates/zio-qualify/src/benchmark/zio_borrowed_backend.rs"

[[ratchet]]
reason = "Compact descriptor retention confines raw reconstruction and caller-managed lifetime trust to one reviewed leaf."
rule = "rust.hygiene.unsafe"
target = "src/descriptor.rs"

[[ratchet]]
reason = "The mutation seam explicitly propagates the public borrowed-descriptor lifetime contract into fixed storage."
rule = "rust.hygiene.unsafe"
target = "src/mutation/machine.rs"

[[ratchet]]
reason = "The public borrowed-registration entrypoint states the complete caller-managed descriptor lifetime contract."
rule = "rust.hygiene.unsafe"
target = "src/registration_borrowed.rs"

[[ratchet]]
reason = "The scripted poller mirrors the production unsafe boundary for deterministic lifetime failure evidence."
rule = "rust.hygiene.unsafe"
target = "src/test_support/poll.rs"

[repository]
exclude = []
nested_git = "deny"
roots = ["."]
submodules = "deny"
symlinks = "inside"
workspace_members = "exact"

[[scope]]
exclude = ["src/**/*_test.rs"]
include = ["src/**"]
name = "caller-supplied-io-boundary"
reason = "Production code polls caller-supplied descriptors without opening sockets, files, processes, or threads."

[scope.symbols]
deny = [
    "std::fs",
    "std::net",
    "std::process",
    "std::thread",
]

[source.rust]
entrypoints = "declarative"
facades = "declarative"
module_docs = "required"
tests = "sibling"

[source.rust.hygiene]
deny_macros = [
    "panic",
    "todo",
    "unimplemented",
    "unreachable",
    "dbg",
]
deny_methods = [
    "unwrap",
    "expect",
]
lint_suppressions = "reasoned"
unsafe = "deny"

[source.rust.macros]
mode = "allow"

[source.rust.size.auxiliary]
hard = 300
target = 300

[source.rust.size.facade]
hard = 120
target = 80

[source.rust.size.implementation]
hard = 300
target = 240

[source.rust.size.test]
hard = 300
target = 300
