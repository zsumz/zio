    "crates/zio-qualify/src/polling_registration.rs",
    "docs/performance.md",
    "rust-toolchain.toml",
]
kind = "ci"
name = "performance"
path = ".github/workflows/performance.yml"
reason = "Hosted Linux and macOS runs retain reproducible timing, allocation, descriptor, and syscall receipts."
requires = ["check"]

[[gate]]
inputs = [
    "Cargo.lock",
    "Cargo.toml",
    "LICENSE",
    "README.md",
    "docs/contracts.md",
    "docs/performance.md",
    "docs/qualification.md",
    "rust-toolchain.toml",
    "scripts/check-api-evolution",
    "scripts/rehearse-release",
    "zcheck.toml",
    "zio-logo.svg",
]
kind = "release"
name = "release"
path = ".github/workflows/release-rehearsal.yml"
reason = "Hosted release qualification executes the reviewed clean-checkout rehearsal and retains its receipt."
requires = ["check"]

