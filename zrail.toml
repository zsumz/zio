adapters = ["rust"]
schema = 2

[dependencies]
cycles = "deny"
mode = "locked"
unassigned_packages = "deny"

[[dependencies.crate_root]]
package = "libc"
reason = "The target-gated libc package exposes the native syscall constants, layouts, and functions."
root = "libc"

[dependencies.crate_root.source]
kind = "registry"
requirement = "0.2.189"

[[dependencies.crate_root]]
package = "mio"
reason = "The dev-only Mio package is the differential readiness oracle."
root = "mio"

[dependencies.crate_root.source]
kind = "registry"
requirement = "1.2.2"

[[dependencies.crate_root]]
package = "allocation-counter"
reason = "The dev-only allocation counter measures wait-path heap behavior in native tests."
root = "allocation_counter"

[dependencies.crate_root.source]
kind = "registry"
requirement = "=0.8.1"

[[dependencies.crate_root]]
package = "socket2"
reason = "The dev-only socket2 package safely configures refused-connect and abortive-close fixtures."
root = "socket2"

[dependencies.crate_root.source]
kind = "registry"
requirement = "=0.6.5"

[[dependency]]
deny = ["zio-testkit"]
from = "zio"
name = "library-remains-verification-free"
reason = "The published readiness library must not depend on workspace-private conformance machinery."

[[gate]]
inputs = [
    ".editorconfig",
    ".gitattributes",
    ".github/workflows/ci.yml",
    ".gitignore",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "zio-logo.svg",
    "LICENSE",
    "rust-toolchain.toml",
    "rustfmt.toml",
    "clippy.toml",
    "crates/zio-testkit/Cargo.toml",
    "crates/zio-testkit/README.md",
    "docs/contracts.md",
    "docs/qualification.md",
]
kind = "local"
name = "check"
path = "zcheck.toml"
reason = "The declarative canonical qualification graph and its reviewed inputs."

[[gate]]
inputs = [
    "rust-toolchain.toml",
    "zcheck.toml",
]
kind = "ci"
name = "ci"
path = ".github/workflows/ci.yml"
reason = "Hosted qualification runs the canonical Linux graph and real macOS kqueue tests."
requires = ["check"]

[[invariant]]
document = "docs/contracts.md#registration-ownership"
evidence = [
    "rust-test:tests/descriptor_identity.rs::numeric_descriptor_reuse_does_not_alias_retained_registration",
    "rust-test:tests/descriptor_identity.rs::duplicated_handles_have_independent_registrations",
    "rust-test:tests/descriptor_identity.rs::one_handle_can_have_independent_registrations",
    "rust-test:crates/zio-testkit/tests/terminal_identity.rs::delete_applied_stale_handle_survives_slot_reuse",
    "rust-test:crates/zio-testkit/tests/terminal_ownership.rs::wrong_poller_delete_returns_exact_handle_to_owner",
    "gate:check",
    "gate:ci",
]
id = "OWNERSHIP-01"
status = "enforced"
title = "Each registration owns a retained descriptor and exact generation"

[[invariant]]
document = "docs/contracts.md#readiness-modes"
evidence = [
    "rust-test:tests/readiness.rs::one_shot_requires_explicit_rearm",
    "rust-test:src/sys/kqueue_group/kqueue_disarm_test.rs::one_submission_reduces_multiple_registrations",
    "rust-test:src/sys/kqueue_group/kqueue_disarm_matrix_test.rs::one_batch_preserves_change_outcome_and_source_order",
    "gate:check",
    "gate:ci",
]
id = "MODE-01"
status = "enforced"
title = "One-shot readiness requires explicit rearming after delivery"

[[invariant]]
document = "docs/contracts.md#readiness-contract"
evidence = [
    "rust-test:src/sys/linux_group/backend_test.rs::epoll_readiness_truth_table_is_exhaustive",
    "rust-test:src/sys/linux_group/backend_test.rs::epoll_error_closure_inference_is_deliberately_narrow",
    "rust-test:src/sys/linux_group/backend_test.rs::epoll_combined_delivery_preserves_every_hint",
    "rust-test:src/sys/kqueue_group/backend_test.rs::kqueue_readiness_truth_table_is_exhaustive",
    "rust-test:src/sys/kqueue_group/backend_test.rs::kqueue_fflags_require_eof_to_become_an_error_hint",
    "rust-test:src/sys/kqueue_group/backend_test.rs::kqueue_pending_io_and_eof_hints_remain_combined",
    "rust-test:tests/refused_connect.rs::refused_connect_level_reports_error_and_socket_cause",
    "rust-test:tests/refused_connect.rs::refused_connect_one_shot_reports_error_and_socket_cause_and_disarms",
    "rust-test:tests/reset_readiness.rs::abortive_peer_close_reports_error_and_read_closure",
    "rust-test:tests/reset_readiness.rs::abortive_peer_close_one_shot_disarms_exactly_once",
    "rust-test:crates/zio-testkit/tests/readiness_conformance.rs::readiness_report_covers_every_scenario",
    "rust-test:crates/zio-testkit/tests/readiness_conformance.rs::readiness_scenario_names_are_stable",
    "rust-test:crates/zio-testkit/tests/readiness_conformance.rs::readiness_scenario_parameters_cover_the_portable_matrix",
    "rust-test:crates/zio-testkit/tests/readiness_conformance.rs::readiness_failures_remain_structured",
    "gate:check",
    "gate:ci",
]
id = "READINESS-01"
status = "enforced"
title = "Portable readiness preserves directional closure and resource errors"

[[invariant]]
document = "docs/contracts.md#recovery-behavior"
evidence = [
    "rust-test:src/sys/kqueue_group/kqueue_disarm_test.rs::one_submission_reduces_multiple_registrations",
    "rust-test:src/sys/kqueue_group/kqueue_disarm_test.rs::all_failed_filters_preserve_armed_outcome",
    "rust-test:src/sys/kqueue_group/kqueue_disarm_test.rs::mixed_filter_results_are_unknown",
    "rust-test:src/sys/kqueue_group/kqueue_disarm_test.rs::short_receipt_sets_are_unknown",
    "rust-test:src/sys/kqueue_group/kqueue_disarm_test.rs::malformed_receipts_are_unknown",
    "rust-test:src/sys/kqueue_group/kqueue_disarm_test.rs::mismatched_receipts_are_unknown",
    "rust-test:src/sys/kqueue_group/kqueue_disarm_test.rs::missing_native_filter_receipt_is_uncertain",
    "rust-test:src/sys/kqueue_group/kqueue_disarm_test.rs::uncertain_receipt_preserves_native_error",
    "rust-test:src/sys/kqueue_group/kqueue_disarm_test.rs::syscall_failure_is_unknown",
    "rust-test:src/sys/kqueue_group/kqueue_disarm_test.rs::freebsd_and_netbsd_interruptions_are_applied",
    "rust-test:src/sys/kqueue_group/kqueue_disarm_test.rs::macos_interruptions_are_unknown",
    "rust-test:src/sys/kqueue_group/kqueue_disarm_matrix_test.rs::one_batch_preserves_change_outcome_and_source_order",
    "rust-test:src/sys/kqueue_group/kqueue_disarm_matrix_test.rs::target_selected_interruption_policy_is_exact",
    "rust-test:src/error/recovery_test.rs::recovery_outcomes_enforce_commit_state_pairs",
    "rust-test:src/observe_test.rs::recovery_failure_preserves_translated_resource_and_wake_events",
    "rust-test:src/observe_test.rs::retained_recovery_errors_survive_poll_state_reuse",
    "rust-test:src/observe_test.rs::incomplete_recovery_outcomes_fail_before_observation_or_state_change",
    "rust-test:src/observe_test.rs::recovery_source_presence_matches_degraded_outcomes",
    "rust-test:src/observe_validation_test.rs::extra_recovery_outcomes_are_rejected_atomically",
    "rust-test:src/observe_validation_test.rs::reordered_recovery_outcomes_are_rejected_atomically",
    "rust-test:src/observe_validation_test.rs::non_armed_recovery_plans_are_rejected_atomically",
    "gate:check",
    "gate:ci",
]
id = "RECOVERY-01"
status = "enforced"
title = "Kqueue recovery preserves translated events and exact outcomes"

[[invariant]]
document = "docs/contracts.md#allocation-contract"
evidence = [
    "rust-test:tests/allocation_contract.rs::successful_one_shot_wait_allocates_nothing",
    "rust-test:src/observe_allocation_test.rs::recovery_retains_exactly_one_bounded_allocation",
    "rust-test:src/sys/kqueue_group/kqueue_disarm_test.rs::one_submission_reduces_multiple_registrations",
    "rust-test:src/sys/kqueue_group/kqueue_disarm_test.rs::successful_batches_reuse_retained_storage",
    "rust-test:src/sys/raw_batch_test.rs::disarm_storage_uses_the_smaller_configured_limit",
    "rust-test:src/error/recovery_test.rs::recovery_failure_preserves_one_owned_snapshot",
    "rust-test:src/error/recovery_test.rs::retained_recovery_snapshots_are_independent",
    "rust-test:src/observe_test.rs::retained_recovery_errors_survive_poll_state_reuse",
    "gate:check",
    "gate:ci",
]
id = "STORAGE-01"
status = "enforced"
title = "Waits reuse retained storage and recovery owns one bounded snapshot"

[[invariant]]
document = "docs/contracts.md#wait-behavior"
evidence = [
    "rust-test:src/sys/linux_group/backend_test.rs::zero_timeouts_remain_nonblocking",
    "rust-test:src/sys/linux_group/backend_test.rs::one_nanosecond_rounds_up_to_one_millisecond",
    "gate:check",
    "gate:ci",
]
id = "WAIT-01"
status = "enforced"
title = "Positive waits never collapse to nonblocking observations"

[[invariant]]
document = "docs/contracts.md#wake-behavior"
evidence = [
    "rust-test:tests/readiness.rs::wake_before_wait_is_observable",
    "rust-test:tests/readiness.rs::wake_interrupts_a_blocked_wait",
    "rust-test:crates/zio-testkit/tests/wake_conformance.rs::wake_report_covers_every_scenario",
    "rust-test:crates/zio-testkit/tests/wake_conformance.rs::wake_scenario_names_are_stable",
    "rust-test:crates/zio-testkit/tests/wake_conformance.rs::wake_failures_remain_structured",
    "gate:check",
    "gate:ci",
]
id = "WAKE-01"
status = "enforced"
title = "Wake signals remain bounded, drainable, and observable"

[[invariant]]
document = "docs/contracts.md#mutation-outcomes"
evidence = [
    "rust-test:src/sys/kqueue_group/kqueue_policy_test.rs::failed_modify_with_failed_restore_is_unknown",
    "rust-test:src/sys/kqueue_group/kqueue_policy_test.rs::partial_register_failure_with_cleanup_is_not_applied",
    "rust-test:src/sys/kqueue_group/kqueue_policy_test.rs::partial_register_failure_with_failed_cleanup_is_unknown",
    "rust-test:src/sys/kqueue_group/kqueue_policy_test.rs::failed_delete_cleanup_is_unknown_and_retains_failed_filter",
    "rust-test:crates/zio-testkit/tests/public_api.rs::full_report_covers_every_scenario",
    "rust-test:crates/zio-testkit/tests/register_conformance.rs::register_branches_preserve_error_state_and_capabilities",
    "rust-test:crates/zio-testkit/tests/modify_conformance.rs::modify_branches_preserve_error_state_and_retries",
    "rust-test:crates/zio-testkit/tests/delete_conformance.rs::delete_branches_preserve_returned_handles_and_retries",
    "gate:check",
    "gate:ci",
]
id = "MUTATION-01"
status = "enforced"
title = "Mutation outcomes preserve exact state and capabilities"

[[layer]]
may_depend_on = []
name = "library"
packages = ["zio"]
reason = "One focused readiness library owns its portable vocabulary and native backends."

[layer.dependencies]
external = "locked"

[[layer]]
may_depend_on = ["library"]
name = "verification"
packages = ["zio-testkit"]
reason = "Deterministic conformance support may exercise the public library without entering the product dependency graph."

[layer.dependencies]
external = "none"

[[owner]]
allow = [
    "src/sys/kqueue_group/kqueue.rs",
    "src/sys/kqueue_group/kqueue_codec.rs",
    "src/sys/kqueue_group/kqueue_policy.rs",
    "src/sys/kqueue_group/kqueue_policy_test.rs",
    "src/sys/kqueue_group/kqueue_timeout.rs",
    "src/sys/linux_group/backend.rs",
    "src/sys/linux_group/epoll.rs",
    "src/sys/linux_group/eventfd.rs",
]
kind = "capability"
match = "libc"
name = "native-libc-capability"
reason = "Only native backend and ABI-codec modules use libc directly; unsafe calls remain confined to the three reviewed syscall leaves."
within = ["src/**"]

[[ratchet]]
reason = "Reviewed kqueue FFI and kevent initialization remain confined to this syscall leaf."
rule = "rust.hygiene.unsafe"
target = "src/sys/kqueue_group/kqueue.rs"

[[ratchet]]
reason = "Reviewed epoll FFI and descriptor adoption remain confined to this syscall leaf."
rule = "rust.hygiene.unsafe"
target = "src/sys/linux_group/epoll.rs"

[[ratchet]]
reason = "Reviewed eventfd FFI and descriptor adoption remain confined to this syscall leaf."
rule = "rust.hygiene.unsafe"
target = "src/sys/linux_group/eventfd.rs"

[repository]
exclude = []
nested_git = "deny"
roots = ["."]
submodules = "deny"
symlinks = "inside"
workspace_members = "exact"

[[scope]]
exclude = ["src/**/*_test.rs"]
include = ["src/**"]
name = "caller-supplied-io-boundary"
reason = "Production code polls caller-supplied descriptors without opening sockets, files, processes, or threads."

[scope.symbols]
deny = [
    "std::fs",
    "std::net",
    "std::process",
    "std::thread",
]

[source.rust]
entrypoints = "declarative"
facades = "declarative"
module_docs = "required"
tests = "sibling"

[source.rust.hygiene]
deny_macros = [
    "panic",
    "todo",
    "unimplemented",
    "unreachable",
    "dbg",
]
deny_methods = [
    "unwrap",
    "expect",
]
lint_suppressions = "reasoned"
unsafe = "deny"

[source.rust.macros]
mode = "allow"

[source.rust.size.auxiliary]
hard = 300
target = 300

[source.rust.size.facade]
hard = 120
target = 80

[source.rust.size.implementation]
hard = 300
target = 240

[source.rust.size.test]
hard = 300
target = 300
