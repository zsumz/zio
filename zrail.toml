adapters = ["rust"]
schema = 2

[dependencies]
cycles = "deny"
mode = "locked"
unassigned_packages = "deny"

[[dependencies.crate_root]]
package = "libc"
reason = "The target-gated libc package exposes the native syscall constants, layouts, and functions."
root = "libc"

[dependencies.crate_root.source]
kind = "registry"
requirement = "0.2.189"

[[dependencies.crate_root]]
package = "mio"
reason = "Private differential tests and qualification measure Mio as an independent readiness candidate."
root = "mio"

[dependencies.crate_root.source]
kind = "registry"
requirement = "=1.2.2"

[[dependencies.crate_root]]
package = "polling"
reason = "The private qualification package measures polling as an independent readiness candidate."
root = "polling"

[dependencies.crate_root.source]
kind = "registry"
requirement = "=3.11.0"

[[dependencies.crate_root]]
package = "allocation-counter"
reason = "The optional allocation counter measures qualification and test allocation behavior."
root = "allocation_counter"

[dependencies.crate_root.source]
kind = "registry"
requirement = "=0.8.1"

[[dependencies.crate_root]]
package = "socket2"
reason = "The dev-only socket2 package safely configures refused-connect and abortive-close fixtures."
root = "socket2"

[dependencies.crate_root.source]
kind = "registry"
requirement = "=0.6.5"

[[dependency]]
deny = [
    "zio-qualify",
    "zio-testkit",
]
from = "zio"
name = "library-remains-verification-free"
reason = "The published readiness library must not depend on workspace-private conformance or qualification machinery."

[[gate]]
inputs = [
    ".editorconfig",
    ".gitattributes",
    ".github/workflows/ci.yml",
    ".gitignore",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "zio-logo.svg",
    "LICENSE",
    "rust-toolchain.toml",
    "rustfmt.toml",
    "clippy.toml",
    "crates/zio-qualify/Cargo.toml",
    "crates/zio-qualify/README.md",
    "crates/zio-testkit/Cargo.toml",
    "crates/zio-testkit/README.md",
    "docs/contracts.md",
    "docs/performance.md",
    "docs/qualification.md",
    "scripts/check-api-evolution",
    "scripts/rehearse-release",
]
kind = "local"
name = "check"
path = "zcheck.toml"
reason = "The declarative canonical qualification graph and its reviewed inputs."

[[gate]]
inputs = [
    "rust-toolchain.toml",
    "zcheck.toml",
]
kind = "ci"
name = "ci"
path = ".github/workflows/ci.yml"
reason = "Hosted qualification runs the canonical Linux graph plus native macOS, FreeBSD, and NetBSD execution."
requires = ["check"]

[[gate]]
inputs = [
    "Cargo.lock",
    "Cargo.toml",
    "crates/zio-qualify/Cargo.toml",
